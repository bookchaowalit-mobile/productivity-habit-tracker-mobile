name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  validate:
    name: Format, analyze & test (fail-closed)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies (lockfile must not change)
        run: flutter pub get --enforce-lockfile
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  # Release-mode APK for device testing. android/app/build.gradle.kts signs
  # release builds with the Android debug key (no upload keystore exists), so
  # this APK is NOT a store build and is labelled that way.
  build-android-release:
    name: Release APK (CI, debug-signed, not for store)
    needs: [validate, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build release APK
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: flutter build apk --release --dart-define=SENTRY_DSN="$SENTRY_DSN"
      - name: Label and checksum
        id: apk
        run: |
          name="habit-tracker-${GITHUB_SHA::7}-ci-release-NOT-FOR-STORE.apk"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$name"
          sha=$(sha256sum "dist/$name" | cut -d' ' -f1)
          echo "$sha  $name" > dist/SHA256SUMS
          {
            echo "### Release APK (CI build, debug-signed, not for store)"
            echo ""
            echo "| File | SHA-256 |"
            echo "|---|---|"
            echo "| \`$name\` | \`$sha\` |"
            echo ""
            echo "Commit \`$GITHUB_SHA\`, Flutter $FLUTTER_VERSION. Signed with the Android debug key: for device testing only."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: habit-tracker-apk-ci-NOT-FOR-STORE
          path: dist/
          if-no-files-found: error
          retention-days: 30

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
